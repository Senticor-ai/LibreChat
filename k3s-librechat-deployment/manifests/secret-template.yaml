# LibreChat Credentials Secret Template
# IMPORTANT: DO NOT commit this file with real secrets!
#
# This is a template. Copy it and fill in your actual values:
#   1. Generate secure random values for CREDS_KEY, CREDS_IV, JWT_SECRET, JWT_REFRESH_SECRET
#   2. Add your actual API keys (OpenAI, Anthropic, etc.)
#   3. Apply: kubectl apply -f secret.yaml
#
# To generate secure random values:
#   openssl rand -hex 32  # for CREDS_KEY, JWT_SECRET, JWT_REFRESH_SECRET
#   openssl rand -hex 16  # for CREDS_IV
#   openssl rand -hex 32  # for MEILI_MASTER_KEY

apiVersion: v1
kind: Secret
metadata:
  name: librechat-credentials-env
  namespace: librechat
type: Opaque
stringData:
  # ===========================================================================
  # SECURITY CREDENTIALS (REQUIRED)
  # ===========================================================================

  # Encryption keys for sensitive data storage
  # Generate with: openssl rand -hex 32
  CREDS_KEY: "CHANGE_ME_32_CHAR_HEX"

  # Initialization vector for encryption
  # Generate with: openssl rand -hex 16
  CREDS_IV: "CHANGE_ME_16_CHAR_HEX"

  # JWT signing secret for authentication tokens
  # Generate with: openssl rand -hex 32
  JWT_SECRET: "CHANGE_ME_32_CHAR_HEX"

  # JWT refresh token signing secret
  # Generate with: openssl rand -hex 32
  JWT_REFRESH_SECRET: "CHANGE_ME_32_CHAR_HEX"

  # MeiliSearch master key
  # Generate with: openssl rand -hex 32
  MEILI_MASTER_KEY: "CHANGE_ME_32_CHAR_HEX"

  # ===========================================================================
  # LLM PROVIDER API KEYS
  # ===========================================================================

  # OpenAI (GPT-3.5, GPT-4, etc.)
  OPENAI_API_KEY: "sk-..."

  # Anthropic (Claude)
  # ANTHROPIC_API_KEY: "sk-ant-..."

  # Google AI (Gemini)
  # GOOGLE_API_KEY: "..."

  # Azure OpenAI
  # AZURE_API_KEY: "..."
  # AZURE_OPENAI_ENDPOINT: "https://your-resource.openai.azure.com/"

  # AWS Bedrock (requires AWS credentials)
  # AWS_ACCESS_KEY_ID: "..."
  # AWS_SECRET_ACCESS_KEY: "..."
  # AWS_REGION: "us-east-1"

  # Cohere
  # COHERE_API_KEY: "..."

  # OpenRouter (access to multiple models)
  # OPENROUTER_KEY: "..."

  # Mistral AI
  # MISTRAL_API_KEY: "..."

  # Groq
  # GROQ_API_KEY: "..."

  # Perplexity
  # PERPLEXITY_API_KEY: "..."

  # ===========================================================================
  # OPTIONAL: SOCIAL LOGIN CREDENTIALS
  # ===========================================================================

  # Google OAuth
  # GOOGLE_CLIENT_ID: "..."
  # GOOGLE_CLIENT_SECRET: "..."
  # GOOGLE_CALLBACK_URL: "https://chat.example.com/oauth/google/callback"

  # GitHub OAuth
  # GITHUB_CLIENT_ID: "..."
  # GITHUB_CLIENT_SECRET: "..."
  # GITHUB_CALLBACK_URL: "https://chat.example.com/oauth/github/callback"

  # Discord OAuth
  # DISCORD_CLIENT_ID: "..."
  # DISCORD_CLIENT_SECRET: "..."
  # DISCORD_CALLBACK_URL: "https://chat.example.com/oauth/discord/callback"

  # ===========================================================================
  # OPTIONAL: FILE STORAGE (S3/Firebase)
  # ===========================================================================

  # AWS S3 for file storage
  # S3_ENDPOINT: "s3.amazonaws.com"
  # S3_REGION: "us-east-1"
  # S3_ACCESS_KEY_ID: "..."
  # S3_SECRET_ACCESS_KEY: "..."
  # S3_BUCKET: "librechat-uploads"

  # Firebase for file storage
  # FIREBASE_PROJECT_ID: "..."
  # FIREBASE_PRIVATE_KEY: "..."
  # FIREBASE_CLIENT_EMAIL: "..."
  # FIREBASE_STORAGE_BUCKET: "..."

  # ===========================================================================
  # OPTIONAL: EMAIL CONFIGURATION
  # ===========================================================================

  # Email service for password reset, etc.
  # EMAIL_SERVICE: "gmail"  # or "smtp"
  # EMAIL_USERNAME: "your-email@gmail.com"
  # EMAIL_PASSWORD: "your-app-password"
  # EMAIL_FROM: "LibreChat <noreply@example.com>"

  # SMTP Configuration (if not using a service like Gmail)
  # EMAIL_HOST: "smtp.example.com"
  # EMAIL_PORT: "587"
  # EMAIL_ENCRYPTION: "tls"

  # ===========================================================================
  # OPTIONAL: MCP SERVER CREDENTIALS
  # ===========================================================================

  # If your MCP servers require OAuth or API keys, add them here
  # MCP_CLIENT_ID: "..."
  # MCP_CLIENT_SECRET: "..."
