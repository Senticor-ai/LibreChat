# Infisical Standalone Secrets
# IMPORTANT: This file should NOT be committed to version control
# Add to .gitignore

apiVersion: v1
kind: Secret
metadata:
  name: infisical-secrets
  namespace: infisical
type: Opaque
stringData:
  # ===========================================================================
  # REQUIRED SECRETS
  # ===========================================================================

  # Auth secret for JWT signing
  # Generate with: openssl rand -base64 32
  AUTH_SECRET: "CHANGE_ME_GENERATED_VALUE"

  # Encryption key for sensitive data
  # Generate with: openssl rand -hex 16
  ENCRYPTION_KEY: "CHANGE_ME_GENERATED_VALUE"

  # Site URL (your Infisical domain)
  SITE_URL: "https://infisical.example.com"  # CHANGE THIS

  # ===========================================================================
  # OPTIONAL: SMTP CONFIGURATION (Recommended for production)
  # ===========================================================================

  # SMTP settings for email invitations and notifications
  # SMTP_HOST: "smtp.example.com"
  # SMTP_PORT: "587"
  # SMTP_SECURE: "false"  # true for port 465, false for other ports
  # SMTP_USERNAME: "your-email@example.com"
  # SMTP_PASSWORD: "your-smtp-password"
  # SMTP_FROM_ADDRESS: "noreply@example.com"
  # SMTP_FROM_NAME: "Infisical"

  # ===========================================================================
  # OPTIONAL: EXTERNAL DATABASE (Production)
  # ===========================================================================

  # If using external PostgreSQL instead of built-in:
  # DB_CONNECTION_URI: "postgresql://user:password@postgres.example.com:5432/infisical"

  # If using external Redis instead of built-in:
  # REDIS_URL: "redis://:password@redis.example.com:6379"
