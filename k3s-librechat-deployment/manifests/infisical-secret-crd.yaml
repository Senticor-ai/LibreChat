# InfisicalSecret CRD for LibreChat Deployment
# Documentation: https://infisical.com/docs/integrations/platforms/kubernetes/infisical-secret-crd

apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: librechat-credentials
  namespace: librechat
  labels:
    app.kubernetes.io/name: librechat
    app.kubernetes.io/component: secrets
  annotations:
    description: "LibreChat application secrets managed by Infisical"
spec:
  # ===========================================================================
  # AUTHENTICATION CONFIGURATION
  # ===========================================================================

  # Using Universal Auth (Machine Identity)
  # Prerequisites:
  # 1. Create a Machine Identity in Infisical (Organization Settings > Access Control > Machine Identities)
  # 2. Configure Universal Auth for the identity
  # 3. Create Kubernetes secret with credentials:
  #    kubectl create secret generic infisical-universal-auth \
  #      --from-literal=clientId="<your-client-id>" \
  #      --from-literal=clientSecret="<your-client-secret>" \
  #      --namespace librechat

  authentication:
    universalAuth:
      credentialsRef:
        secretName: infisical-universal-auth
        secretNamespace: librechat

  # ===========================================================================
  # SECRETS SCOPE
  # ===========================================================================

  # Defines which secrets to fetch from Infisical
  secretsScope:
    # Project identifier (slug or ID)
    projectSlug: "librechat"  # CHANGE THIS to your Infisical project slug

    # Environment (dev, staging, prod, etc.)
    envSlug: "prod"  # CHANGE THIS to your environment

    # Path within the project (use "/" for root)
    secretsPath: "/"

    # Optional: Fetch only a specific secret by name
    # secretName: "OPENAI_API_KEY"

  # ===========================================================================
  # MANAGED KUBERNETES SECRET
  # ===========================================================================

  # Target Kubernetes secret to create/update
  managedKubeSecretReferences:
    - secretName: librechat-credentials-env
      secretNamespace: librechat

      # Creation policy:
      # - "Orphan" (default): Secret persists after CRD deletion
      # - "Owner": Secret is deleted with CRD (ArgoCD compatible)
      creationPolicy: "Orphan"

      # Secret type (default: Opaque)
      secretType: Opaque

  # ===========================================================================
  # SECRET TEMPLATING (Optional)
  # ===========================================================================

  # Transform secrets before storing in Kubernetes
  # Useful for composing URLs, formatting values, etc.
  # template:
  #   includeAllSecrets: true
  #   data:
  #     # Direct mapping (default behavior if template not specified)
  #     OPENAI_API_KEY: "{{ .OPENAI_API_KEY.Value }}"
  #
  #     # Compose values from multiple secrets
  #     MONGO_URI: "mongodb://{{ .MONGO_USER.Value }}:{{ .MONGO_PASSWORD.Value }}@librechat-mongodb:27017/LibreChat"
  #
  #     # Build URLs from components
  #     DOMAIN_CLIENT: "https://{{ .DOMAIN_NAME.Value }}"
  #     DOMAIN_SERVER: "https://{{ .DOMAIN_NAME.Value }}"

  # ===========================================================================
  # SYNC CONFIGURATION
  # ===========================================================================

  # How often to check for secret updates (in seconds)
  resyncInterval: 60

  # Optional: Enable instant updates (requires Infisical paid plan)
  # instantUpdates: true

  # ===========================================================================
  # INFISICAL API ENDPOINT (Optional)
  # ===========================================================================

  # Default: Infisical Cloud (https://app.infisical.com/api)
  # For self-hosted Infisical, specify your instance:
  # hostAPI: "https://your-infisical.com/api"

  # Optional: TLS configuration for self-hosted instances
  # tls:
  #   caRef:
  #     secretName: infisical-ca-cert
  #     secretNamespace: librechat
  #     key: ca.crt

---
# ===========================================================================
# ALTERNATIVE: Using Kubernetes Native Auth (Service Account Tokens)
# ===========================================================================
#
# This method uses Kubernetes service account tokens for authentication
# Requires configuring the Machine Identity in Infisical with Kubernetes Auth
#
# apiVersion: secrets.infisical.com/v1alpha1
# kind: InfisicalSecret
# metadata:
#   name: librechat-credentials
#   namespace: librechat
# spec:
#   authentication:
#     kubernetesAuth:
#       serviceAccountRef:
#         name: infisical-auth
#         namespace: librechat
#       identityId: "<your-machine-identity-id>"
#   secretsScope:
#     projectSlug: "librechat"
#     envSlug: "prod"
#     secretsPath: "/"
#   managedKubeSecretReferences:
#     - secretName: librechat-credentials-env
#       secretNamespace: librechat
#       creationPolicy: "Orphan"

---
# ===========================================================================
# SERVICE ACCOUNT FOR AUTO-REDEPLOYMENT
# ===========================================================================
#
# The Infisical operator uses this service account to trigger rolling restarts
# when secrets are updated (if auto-reload annotation is enabled)

apiVersion: v1
kind: ServiceAccount
metadata:
  name: infisical-auth
  namespace: librechat
  labels:
    app.kubernetes.io/name: librechat
    app.kubernetes.io/component: secrets
